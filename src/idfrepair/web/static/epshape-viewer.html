<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>IDFRepair EPShape 查看器</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/epshape-viewer.css?v=20260819abmv3f">
</head>
<body>
  <main class="viewer-shell">
    <header class="viewer-toolbar">
      <div class="file-identity">
        <strong id="viewer-file">IDF 几何</strong>
        <span id="viewer-status" role="status">等待本地 IDF</span>
      </div>
      <div id="viewer-actions" class="viewer-actions" aria-label="模型查看控件">
        <label id="color-mode-control" class="color-mode-control" title="模型配色方式">
          <span id="color-mode-label">配色</span>
          <select id="color-mode" aria-label="模型配色方式">
            <option value="surfaceType">SurfaceType</option>
            <option value="normal">Normal</option>
            <option value="boundary">Boundary</option>
            <option value="construction">Construction</option>
            <option value="thermalZone">ThermalZone</option>
            <option value="spaceType">SpaceType</option>
            <option value="buildingStory">BuildingStory</option>
            <option value="roomFunction" disabled>房间功能</option>
            <option value="occupancy" disabled>人员占用</option>
          </select>
        </label>
        <button id="toggle-rooms" type="button" title="显示或隐藏房间" aria-label="显示或隐藏房间" aria-expanded="false">▦</button>
        <button id="fit-model" type="button" title="适配模型" aria-label="适配模型">⌂</button>
        <button id="focus-error" type="button" title="聚焦当前错误" aria-label="聚焦当前错误">◎</button>
      </div>
    </header>
    <div id="canvas-container" class="canvas-container" tabindex="0" aria-label="交互式 IDF 三维模型">
      <div id="viewer-empty" class="viewer-empty">
        <span aria-hidden="true">◇</span>
        <strong>只读 IDF 几何</strong>
        <small>请在修复工作台选择一个 IDF。</small>
      </div>
      <div id="error-caption" class="error-caption" hidden></div>
      <section id="occupancy-controls" class="occupancy-controls" aria-label="人员流量时间控制" hidden>
        <div class="occupancy-control-row">
          <button id="occupancy-play" type="button" aria-label="播放人员流量">▶</button>
          <span id="occupancy-time-label" class="occupancy-time-label" aria-live="polite">00:00–00:15</span>
          <button id="occupancy-details-toggle" type="button" aria-pressed="true" aria-label="隐藏人员详情">详情</button>
          <label class="occupancy-metric-control">
            <span>指标</span>
            <select id="occupancy-metric" aria-label="人员流量着色指标">
              <option value="density">人员密度（人/m²）</option>
              <option value="count">人员数</option>
              <option value="capacity">设计容量百分比</option>
            </select>
          </label>
          <button id="occupancy-controls-toggle" type="button" aria-expanded="true" aria-label="最小化人员时间条">▾</button>
        </div>
        <div class="occupancy-scenario-row">
          <strong id="occupancy-scenario">—</strong>
          <span><i class="timeline-key occupancy-key"></i>人员占用</span>
          <span><i class="timeline-key heating-key"></i>供暖负荷</span>
          <span><i class="timeline-key cooling-key"></i>制冷负荷</span>
        </div>
        <div class="occupancy-filter-row">
          <div id="occupancy-class-filters" class="occupancy-class-filters" role="group" aria-label="人员类别" hidden>
            <button type="button" class="active" data-agent-class="ALL" aria-pressed="true">全部</button>
            <button type="button" data-agent-class="DOMESTIC_DEPARTURE" aria-pressed="false">国内出发</button>
            <button type="button" data-agent-class="DOMESTIC_ARRIVAL" aria-pressed="false">国内到达</button>
            <button type="button" data-agent-class="DOMESTIC_TRANSFER" aria-pressed="false">国内中转</button>
            <button type="button" data-agent-class="INTERNATIONAL_ARRIVAL" aria-pressed="false">国际到达</button>
            <button type="button" data-agent-class="STAFF" aria-pressed="false">工作人员</button>
          </div>
          <label id="occupancy-flow-layer" class="occupancy-flow-toggle" title="绿色表示 OSM Door 强证据；橙色表示受控的功能流程抽象，不是实测步行轨迹" hidden>
            <input id="occupancy-flow-toggle" type="checkbox" checked>
            <span>显示房间边流向</span>
          </label>
          <small id="occupancy-flow-evidence" class="occupancy-flow-evidence" hidden>实线：Door 房间连接 · 虚线：受控流程 · ◆绿进模 / 紫离模</small>
        </div>
        <label class="occupancy-chart-control" for="occupancy-time">
          <svg id="occupancy-timeline-chart" viewBox="0 0 960 150" preserveAspectRatio="none" aria-hidden="true">
            <polyline id="occupancy-timeline-people" class="timeline-people" points=""></polyline>
            <polyline id="occupancy-timeline-heating" class="timeline-heating" points=""></polyline>
            <polyline id="occupancy-timeline-cooling" class="timeline-cooling" points=""></polyline>
            <line id="occupancy-timeline-cursor" class="timeline-cursor" x1="0" y1="0" x2="0" y2="150"></line>
          </svg>
          <input id="occupancy-time" type="range" min="0" max="95" step="1" value="0" aria-label="在人员与热负荷图表上选择 15 分钟时刻">
        </label>
      </section>
      <aside id="occupancy-details" class="occupancy-details" aria-label="房间人员与热负荷详情" hidden>
        <div class="occupancy-details-heading">
          <button id="occupancy-details-drag-handle" class="occupancy-details-drag-handle" type="button" aria-label="拖动人员详情">⠿</button>
          <strong id="occupancy-detail-name">—</strong>
          <span id="occupancy-entrance-badge" class="occupancy-entrance-badge" hidden>入口种子</span>
          <span id="occupancy-conflict-badge" hidden>源模型元数据冲突</span>
          <button id="occupancy-details-close" class="occupancy-details-close" type="button" aria-label="关闭人员详情">×</button>
        </div>
        <dl>
          <div><dt>房间功能</dt><dd id="occupancy-detail-category">—</dd></div>
          <div><dt>当前人数</dt><dd id="occupancy-detail-people">—</dd></div>
          <div><dt>人员密度</dt><dd id="occupancy-detail-density">—</dd></div>
          <div><dt>设计容量</dt><dd id="occupancy-detail-capacity">—</dd></div>
          <div><dt>流向 / 类别</dt><dd id="occupancy-detail-flow">—</dd></div>
          <div><dt>Zone / HVAC</dt><dd id="occupancy-detail-hvac">—</dd></div>
          <div><dt>方法边界</dt><dd id="occupancy-detail-phase">—</dd></div>
          <div><dt>情景与时刻</dt><dd id="occupancy-detail-scenario">—</dd></div>
          <div><dt>供暖与制冷</dt><dd id="occupancy-detail-load">—</dd></div>
        </dl>
      </aside>
      <aside id="issue-mode-legend" class="issue-mode-legend" aria-label="问题定位图例" hidden>
        <div class="issue-mode-heading">
          <div>
            <strong id="issue-mode-title">当前问题</strong>
            <small id="issue-mode-scope">—</small>
          </div>
          <button id="exit-issue-mode" type="button">退出问题定位</button>
        </div>
        <div class="issue-mode-keys">
          <span id="issue-key-target" class="issue-key-target"><i></i><b>当前问题表面</b></span>
          <span id="issue-key-paired" class="issue-key-paired"><i></i><b>配对表面</b></span>
          <span id="issue-key-group" class="issue-key-group"><i></i><b>同组问题</b></span>
          <span id="issue-key-neutral" class="issue-key-neutral"><i></i><b>其他表面</b></span>
          <span id="issue-key-before" class="issue-key-before"><i></i><b>修复前轮廓</b></span>
          <span id="issue-key-after" class="issue-key-after"><i></i><b>修复后轮廓</b></span>
        </div>
      </aside>
      <aside id="room-panel" class="room-panel" aria-label="房间显隐" hidden>
        <div class="room-panel-heading">
          <strong id="room-panel-title">房间</strong>
          <button id="close-rooms" type="button" aria-label="关闭房间面板">×</button>
        </div>
        <input id="room-search" type="search" placeholder="搜索房间" aria-label="搜索房间">
        <div class="room-panel-actions">
          <button id="show-all-rooms" type="button">全部显示</button>
          <button id="hide-all-rooms" type="button">全部不选</button>
          <button id="clear-isolation" type="button">退出单间</button>
        </div>
        <div id="room-list" class="room-list"></div>
      </aside>
    </div>
    <footer class="viewer-legend">
      <div id="legend-browser" class="legend-browser">
        <button id="legend-scroll-previous" class="legend-scroll previous" type="button" aria-label="向左浏览图例" aria-controls="legend-items" title="向左浏览图例" hidden>‹</button>
        <div id="legend-items" class="legend-items" role="region" tabindex="0" aria-label="配色图例"></div>
        <button id="legend-scroll-next" class="legend-scroll next" type="button" aria-label="向右浏览图例" aria-controls="legend-items" title="向右浏览图例" hidden>›</button>
      </div>
      <span id="error-key" class="error-key"><i class="legend-error"></i><span id="error-key-label">当前错误</span></span>
      <span id="viewer-hint" class="viewer-hint">拖动旋转 · 滚轮缩放 · 单击查看 · 双击隔离/退出 · R 适配</span>
    </footer>
  </main>
  <script src="/static/epshape-three.js"></script>
  <script src="/static/viewer-issue-state.js?v=20260811v5"></script>
  <script src="/static/occupancy-viewer-state.js?v=20260819abmv3f"></script>
  <script src="/static/epshape-viewer.js?v=20260819abmv3f"></script>
</body>
</html>
